spring:
  application:
    name: ai-code-reviewer
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  security:
    encryption-key: 5v8x/A?D(G+KbPeShVmYq3t6w9z$B&E)
  github:
    app-id: "${GITHUB_APP_ID:}"
    app-name: "${GITHUB_APP_NAME:reviewai-code-reviewer}"
    client-id: "${GITHUB_APP_CLIENT_ID:Iv23libUzilLzVgej6Ia}"
    client-secret: "${GITHUB_APP_CLIENT_SECRET:60b56b7f5e4c2fdbb88c4545cf58ee0ed35d029d}"
    private-key: "${GITHUB_APP_PRIVATE_KEY:}"
    webhook-secret: "${GITHUB_WEBHOOK_SECRET:development_webhook_secret_key_123456}"
    token: "${GITHUB_TOKEN:}"
  ai:
    default-provider: "GEMINI"
    gemini:
      model: "gemini-2.0-flash"
      api-key: "${AI_GEMINI_API_KEY:${GEMINI_API_KEY:}}"
    openai:
      model: "gpt-4o"
      api-key: "${AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}"
    ollama:
      base-url: "${AI_OLLAMA_BASE_URL:http://localhost:11434}"
      model: "deepseek-coder:6.7b"
